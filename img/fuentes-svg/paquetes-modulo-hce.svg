<text x="64" y="730" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1d2533">Raíz de composición del monolito: un solo host ASP.NET Core que referencia todos los módulos. Llama a AgregarModuloHce(),</text>
<text x="64" y="758" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1d2533">definido en DependencyInjection.cs, que registra qué adaptador implementa cada contrato, y mapea los controladores.</text>
<text x="64" y="786" font-size="15.5" font-weight="normal" text-anchor="start" fill="#1d2533">Es el único proyecto que conoce todas las capas. Las referencias entre proyectos impiden en compilación que el dominio dependa de las capas externas.</text>
