# Integración continua del SIGH (T117, specs/001-admin-auth-rbac).
# Ante cada push a main y cada pull request: compila, ejecuta todas las pruebas (incluidas las de
# integración con PostgreSQL en Docker), publica los reportes de cobertura y busca secretos (EQ-11).
# Es el único archivo fuera de tecnologia/ porque GitHub solo lee los flujos desde .github/workflows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10) – pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecnologia/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar herramientas y paquetes
        run: |
          dotnet tool restore
          dotnet restore

      - name: Compilar (advertencias como errores)
        run: dotnet build --no-restore -c Release

      # Incluye Sigh.Administracion.Integracion.Tests: Testcontainers usa el Docker del runner.
      - name: Ejecutar todas las pruebas con cobertura
        run: >
          dotnet test --no-build -c Release
          --settings cobertura.runsettings
          --collect "XPlat Code Coverage"
          --logger "trx;LogFilePrefix=resultados"

      - name: Generar el reporte de cobertura
        if: always()
        run: >
          dotnet tool run reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:cobertura
          -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"

      - name: Publicar el resumen de cobertura
        if: always()
        run: cat cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: |
            tecnologia/backend/cobertura/
            tecnologia/backend/TestResults/**/*.trx

  frontend:
    name: Frontend (React) – pruebas, cobertura y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecnologia/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tecnologia/frontend/package-lock.json

      - run: npm ci

      - name: Ejecutar las pruebas con cobertura
        run: npm run test:cobertura

      - name: Publicar el resumen de cobertura
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const fila = (n, m) => '| ' + n + ' | ' + m.pct + ' % | ' + m.covered + ' / ' + m.total + ' |';
            console.log(['### Cobertura del frontend', '', '| Métrica | % | Cubiertas |', '|---|---|---|',
              fila('Líneas', t.lines), fila('Sentencias', t.statements), fila('Ramas', t.branches), fila('Funciones', t.functions)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar (TypeScript y Vite)
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-frontend
          path: tecnologia/frontend/coverage/

  secretos:
    name: Búsqueda de secretos en el historial (EQ-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
