<text x="221.0" y="1232" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1d2533">13. 404 Not Found / 422 Unprocessable Entity {motivo}</text>
<path d="M1060,1170 L1600,1170 L1625,1195 L1625,1290 L1060,1290 z" fill="#fffbe6" stroke="#c9a227" stroke-width="1.4"/>
<text x="1080" y="1196" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1d2533">La atención no se guarda si falla una validación.</text>
<text x="1080" y="1218" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1d2533">El middleware valida el JWT y el rol Médico (RN-03)</text>
<text x="1080" y="1240" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1d2533">antes de llegar al controlador. El controlador traduce</text>
<text x="1080" y="1262" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1d2533">la excepción a un código HTTP.</text>
