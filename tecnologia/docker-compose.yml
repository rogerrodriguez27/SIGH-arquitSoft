# SIGH: entorno completo con un solo comando (principio XI, ADR-010).
#   cd tecnologia
#   docker compose --env-file ../.env up --build
# Los valores reales vienen del archivo .env de la raíz (copiado de .env.example); nunca de este archivo.

services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-sigh_oltp}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__SighOltp: ${ConnectionStrings__SighOltp:?Falta ConnectionStrings__SighOltp en .env}
      Jwt__ClaveFirma: ${Jwt__ClaveFirma:?Falta Jwt__ClaveFirma en .env}
      Jwt__Emisor: ${Jwt__Emisor:-sigh-api}
      Jwt__Audiencia: ${Jwt__Audiencia:-sigh-web}
      Cors__OrigenPermitido: ${Cors__OrigenPermitido:-http://localhost:5173}
      AdminInicial__Usuario: ${AdminInicial__Usuario:-}
      AdminInicial__NombreCompleto: ${AdminInicial__NombreCompleto:-}
      AdminInicial__Contrasena: ${AdminInicial__Contrasena:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/salud || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  datos-postgres:
